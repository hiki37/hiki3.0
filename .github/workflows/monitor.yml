name: Lead Monitor

# Основное планирование - на внешнем cron-job.org (встроенный schedule у
# GitHub ненадёжен на бесплатном тарифе - подтвердили на практике). Именно
# workflow_dispatch дёргает cron-job.org, он же доступен для ручного запуска
# кнопкой Run workflow. Встроенный schedule оставлен только как страховка.
on:
  workflow_dispatch:
  # Подстраховка на случай, если cron-job.org отвалится (у него кончится
  # бесплатный лимит, поменяется токен, упадёт сам сервис). Раз в час - это
  # редко, поэтому даже ненадёжный встроенный schedule лишним не будет:
  # concurrency ниже не даст двум прогонам столкнуться, а дедупликация
  # по seen_leads.json - прислать один и тот же заказ дважды.
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

# Не даёт двум прогонам выполняться одновременно (иначе они бы дрались за
# git push в конце) - следующий запуск просто подождёт, пока текущий закончится.
concurrency:
  group: lead-monitor
  cancel-in-progress: false

jobs:
  check-leads:
    runs-on: ubuntu-latest
    # Жёсткий потолок: даже если что-то внутри зависнет, весь прогон
    # принудительно остановится через 5 минут, а не будет висеть часами.
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run parser tests
        run: python tests/test_kwork_parsing.py

      - name: Run lead monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          IMAP_HOST: ${{ secrets.IMAP_HOST }}
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_PASSWORD: ${{ secrets.IMAP_PASSWORD }}
          SUPERJOB_API_KEY: ${{ secrets.SUPERJOB_API_KEY }}
          HH_CONTACT: ${{ secrets.HH_CONTACT }}
        run: python lead_monitor.py

      - name: Save seen-leads state back to the repo
        run: |
          git config user.name "lead-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add seen_leads.json
          git diff --staged --quiet || git commit -m "chore: update seen leads"
          # Пока прогон шёл, main мог уехать вперёд: cron-job.org и запасной
          # schedule иногда стартуют почти одновременно, и тогда обычный push
          # отлетал с ошибкой, а прогон падал целиком (и накопленное
          # просмотренное терялось). Подтягиваем чужие коммиты и пробуем ещё.
          for attempt in 1 2 3; do
            git push && exit 0
            echo "push не прошёл (попытка $attempt), подтягиваю main"
            git pull --rebase --autostash origin main || exit 1
          done
          git push
